<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এডমিন প্যানেল | পোর্টফোলিও ম্যানেজার</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- Auth Screen -->
  <div class="auth-container" id="authContainer">
    <div class="auth-card">
      <h2 class="auth-title">এডমিন লগইন</h2>
      <p class="auth-subtitle">পোর্টফোলিও এডিট করতে পাসওয়ার্ড দিন</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="adminPassword" class="form-label">পাসওয়ার্ড</label>
          <input type="password" id="adminPassword" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-save" style="width: 100%; padding: 12px;">লগইন করুন</button>
      </form>
    </div>
  </div>

  <!-- Admin Layout (Hidden by default, shown after verification) -->
  <div class="admin-layout" id="adminLayout" style="display: none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        MAGRIB ADMIN<span class="brand-dot">.</span>
      </div>
      <ul class="sidebar-menu">
        <li>
          <button class="menu-btn active" data-tab="tab-bio">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:8px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            বায়ো ও প্রোফাইল
          </button>
        </li>
        <li>
          <button class="menu-btn" data-tab="tab-skills">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:8px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            টেকনিক্যাল স্কিলস
          </button>
        </li>
        <li>
          <button class="menu-btn" data-tab="tab-services">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:8px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
            সার্ভিস সমূহ
          </button>
        </li>
        <li>
          <button class="menu-btn" data-tab="tab-projects">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:8px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
            </svg>
            পোর্টফোলিও প্রজেক্টস
          </button>
        </li>
        <li>
          <button class="menu-btn" data-tab="tab-experience">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:8px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
            অভিজ্ঞতা
          </button>
        </li>
        <li>
          <button class="menu-btn" data-tab="tab-socials">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:8px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
            </svg>
            সোশ্যাল লিংকস
          </button>
        </li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn-logout" id="logoutBtn">লগআউট</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="content-header">
        <h1 class="page-title" id="pageTitle">বায়ো ও প্রোফাইল এডিট</h1>
        <a href="/" target="_blank" class="btn-view-site">
          ওয়েবসাইট দেখুন
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
          </svg>
        </a>
      </div>

      <!-- Tab: Bio & General -->
      <div class="panel-tab-content active" id="tab-bio">
        <div class="panel-card">
          <form id="bioForm">
            <div class="form-row">
              <div class="form-group">
                <label for="bioName" class="form-label">নাম (বাংলা)</label>
                <input type="text" id="bioName" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="bioEnglishName" class="form-label">নাম (ইংরেজি)</label>
                <input type="text" id="bioEnglishName" class="form-control" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="bioTitle" class="form-label">টাইটেল (বাংলা)</label>
                <input type="text" id="bioTitle" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="bioDegree" class="form-label">ডিগ্রী বিবরণ (বাংলা)</label>
                <input type="text" id="bioDegree" class="form-control" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="bioDegreeShort" class="form-label">ডিগ্রী বিবরণ (সংক্ষিপ্ত - ইংরেজি)</label>
                <input type="text" id="bioDegreeShort" class="form-control" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">প্রোফাইল ছবি ১ (প্রধান)</label>
                <div class="upload-container">
                  <img src="/images/avatar.png" class="upload-preview" id="bioProfileImagePreview">
                  <button type="button" class="btn-upload-file">
                    ছবি আপলোড করুন
                    <input type="file" id="bioProfileImageInput" accept="image/*">
                  </button>
                  <input type="hidden" id="bioProfileImageUrl">
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">প্রোফাইল ছবি ২ (সেকেন্ডারি)</label>
                <div class="upload-container">
                  <img src="/images/avatar.png" class="upload-preview" id="bioProfileImagePreview2">
                  <button type="button" class="btn-upload-file">
                    ছবি আপলোড করুন
                    <input type="file" id="bioProfileImageInput2" accept="image/*">
                  </button>
                  <input type="hidden" id="bioProfileImageUrl2">
                </div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="bioExpYears" class="form-label">অভিজ্ঞতা (বছর - ইংরেজি)</label>
                <input type="text" id="bioExpYears" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="bioCompletedProjects" class="form-label">সম্পন্ন প্রজেক্টস সংখ্যা (ইংরেজি)</label>
                <input type="text" id="bioCompletedProjects" class="form-control" required>
              </div>
            </div>
            <div class="form-group">
              <label for="bioHappyClients" class="form-label">হ্যাপি ক্লায়েন্ট সংখ্যা (ইংরেজি)</label>
              <input type="text" id="bioHappyClients" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="bioAboutBengali" class="form-label">আমার সম্পর্কে (বাংলা)</label>
              <textarea id="bioAboutBengali" class="form-control" required></textarea>
            </div>
            <div class="form-group">
              <label for="bioAboutEnglish" class="form-label">আমার সম্পর্কে (ইংরেজি)</label>
              <textarea id="bioAboutEnglish" class="form-control" required></textarea>
            </div>
            <div class="panel-actions">
              <button type="submit" class="btn-save">পরিবর্তন সংরক্ষণ করুন</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Tab: Skills -->
      <div class="panel-tab-content" id="tab-skills">
        <div class="panel-card">
          <div class="list-header">
            <span class="list-title">স্কিল গ্রুপ ম্যানেজমেন্ট</span>
            <button class="btn-add-item" id="btnAddSkillGroup">
              + নতুন স্কিল গ্রুপ
            </button>
          </div>
          <div id="skillsGroupsContainer" class="items-list">
            <!-- Loaded dynamically -->
          </div>
          <div class="panel-actions" style="margin-top: 30px;">
            <button id="btnSaveSkills" class="btn-save">সকল স্কিলস সেভ করুন</button>
          </div>
        </div>
      </div>

      <!-- Tab: Services -->
      <div class="panel-tab-content" id="tab-services">
        <div class="panel-card">
          <div class="list-header">
            <span class="list-title">সার্ভিস ম্যানেজমেন্ট</span>
            <button class="btn-add-item" id="btnAddService">
              + নতুন সার্ভিস
            </button>
          </div>
          <div id="servicesContainer" class="items-list">
            <!-- Loaded dynamically -->
          </div>
          <div class="panel-actions" style="margin-top: 30px;">
            <button id="btnSaveServices" class="btn-save">সকল সার্ভিস সেভ করুন</button>
          </div>
        </div>
      </div>

      <!-- Tab: Projects -->
      <div class="panel-tab-content" id="tab-projects">
        <div class="panel-card">
          <div class="list-header">
            <span class="list-title">পোর্টফোলিও প্রজেক্টস ম্যানেজমেন্ট</span>
            <button class="btn-add-item" id="btnAddProject">
              + নতুন প্রজেক্ট যোগ করুন
            </button>
          </div>
          <div id="projectsContainer" class="items-list">
            <!-- Loaded dynamically -->
          </div>
          <div class="panel-actions" style="margin-top: 30px;">
            <button id="btnSaveProjects" class="btn-save">প্রজেক্ট তালিকা সেভ করুন</button>
          </div>
        </div>
      </div>

      <!-- Tab: Experience -->
      <div class="panel-tab-content" id="tab-experience">
        <div class="panel-card">
          <div class="list-header">
            <span class="list-title">কাজের অভিজ্ঞতা ম্যানেজমেন্ট</span>
            <button class="btn-add-item" id="btnAddExperience">
              + নতুন অভিজ্ঞতা যোগ করুন
            </button>
          </div>
          <div id="experienceContainer" class="items-list">
            <!-- Loaded dynamically -->
          </div>
          <div class="panel-actions" style="margin-top: 30px;">
            <button id="btnSaveExperience" class="btn-save">অভিজ্ঞতা সেভ করুন</button>
          </div>
        </div>
      </div>

      <!-- Tab: Socials -->
      <div class="panel-tab-content" id="tab-socials">
        <div class="panel-card">
          <form id="socialsForm">
            <div class="form-row">
              <div class="form-group">
                <label for="socialEmail" class="form-label">ইমেইল এড্রেস</label>
                <input type="email" id="socialEmail" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="socialPhone" class="form-label">মোবাইল নম্বর</label>
                <input type="text" id="socialPhone" class="form-control" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="socialWhatsapp" class="form-label">হোয়াটসঅ্যাপ নম্বর (যেমন: 8801712345678)</label>
                <input type="text" id="socialWhatsapp" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="socialGithub" class="form-label">গিটহাব প্রোফাইল লিংক</label>
                <input type="url" id="socialGithub" class="form-control">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="socialLinkedin" class="form-label">লিংকডইন প্রোফাইল লিংক</label>
                <input type="url" id="socialLinkedin" class="form-control">
              </div>
              <div class="form-group">
                <label for="socialFacebook" class="form-label">ফেসবুক প্রোফাইল লিংক</label>
                <input type="url" id="socialFacebook" class="form-control">
              </div>
            </div>
            <div class="panel-actions">
              <button type="submit" class="btn-save">সোশ্যাল লিংক সেভ করুন</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <!-- Project Edit Modal -->
  <div class="modal" id="projectModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="projectModalTitle">প্রজেক্ট এডিট</h3>
        <button class="close-btn" id="btnCloseProjectModal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="projectEditForm">
          <input type="hidden" id="modalProjId">
          <div class="form-group">
            <label for="modalProjTitle" class="form-label">প্রজেক্টের নাম</label>
            <input type="text" id="modalProjTitle" class="form-control" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="modalProjCategory" class="form-label">ক্যাটাগরি</label>
              <select id="modalProjCategory" class="form-control" required>
                <option value="iot">IoT & Embedded</option>
                <option value="pcb">PCB Design</option>
                <option value="web">Web Application</option>
                <option value="other">অন্যান্য</option>
              </select>
            </div>
            <div class="form-group">
              <label for="modalProjLink" class="form-label">প্রজেক্ট লিংক / গিটহাব লিংক</label>
              <input type="text" id="modalProjLink" class="form-control">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">প্রজেক্ট ছবি</label>
            <div class="upload-container">
              <img src="/images/project-placeholder.jpg" class="upload-preview" id="modalProjPreview">
              <button type="button" class="btn-upload-file">
                ছবি আপলোড
                <input type="file" id="modalProjImageInput" accept="image/*">
              </button>
              <input type="hidden" id="modalProjImageUrl">
            </div>
          </div>
          <div class="form-group">
            <label for="modalProjTools" class="form-label">ব্যবহৃত টুলস/টেকনোলজি (কমা দিয়ে আলাদা করুন, যেমন: ESP32, Altium, Node.js)</label>
            <input type="text" id="modalProjTools" class="form-control" placeholder="ESP32, Altium, Node.js" required>
          </div>
          <div class="form-group">
            <label for="modalProjDesc" class="form-label">প্রজেক্টের বিস্তারিত বিবরণ</label>
            <textarea id="modalProjDesc" class="form-control" required></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="btnCancelProjectModal">বাতিল</button>
        <button class="btn-save" id="btnSaveProjectModal">প্রজেক্ট সেভ করুন</button>
      </div>
    </div>
  </div>

  <!-- Service Edit Modal -->
  <div class="modal" id="serviceModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="serviceModalTitle">সার্ভিস এডিট</h3>
        <button class="close-btn" id="btnCloseServiceModal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="serviceEditForm">
          <input type="hidden" id="modalServId">
          <div class="form-group">
            <label for="modalServTitle" class="form-label">সার্ভিসের নাম</label>
            <input type="text" id="modalServTitle" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="modalServIcon" class="form-label">আইকন কীওয়ার্ড (যেমন: cpu, layers, layout, settings)</label>
            <select id="modalServIcon" class="form-control" required>
              <option value="cpu">Cpu (হার্ডওয়্যার/আইওটি)</option>
              <option value="layers">Layers (পিসিবি/ডিজাইন)</option>
              <option value="layout">Layout (ড্যাশবোর্ড/ডিজাইন)</option>
              <option value="tool">Tool (ইঞ্জিনিয়ারিং/মেনটেইন)</option>
              <option value="terminal">Terminal (কোডিং)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="modalServDesc" class="form-label">সার্ভিস বিবরণ</label>
            <textarea id="modalServDesc" class="form-control" required></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="btnCancelServiceModal">বাতিল</button>
        <button class="btn-save" id="btnSaveServiceModal">সার্ভিস সেভ করুন</button>
      </div>
    </div>
  </div>

  <!-- Experience Edit Modal -->
  <div class="modal" id="experienceModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="experienceModalTitle">কাজের অভিজ্ঞতা এডিট</h3>
        <button class="close-btn" id="btnCloseExperienceModal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="experienceEditForm">
          <input type="hidden" id="modalExpId">
          <div class="form-group">
            <label for="modalExpRole" class="form-label">পদবি / রোল (Role)</label>
            <input type="text" id="modalExpRole" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="modalExpCompany" class="form-label">কোম্পানির নাম / ক্লায়েন্ট প্ল্যাটফর্ম (Company)</label>
            <input type="text" id="modalExpCompany" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="modalExpPeriod" class="form-label">সময়কাল (যেমন: ২০২৩ - বর্তমান)</label>
            <input type="text" id="modalExpPeriod" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="modalExpDesc" class="form-label">কাজের বিবরণ</label>
            <textarea id="modalExpDesc" class="form-control" required></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="btnCancelExperienceModal">বাতিল</button>
        <button class="btn-save" id="btnSaveExperienceModal">অভিজ্ঞতা সেভ করুন</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">সংরক্ষণ করা হয়েছে!</div>

  <!-- Script -->
  <script src="/js/admin.js"></script>
</body>
</html>
